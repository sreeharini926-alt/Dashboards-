<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>FMCG Financial Dashboard FY2021–FY2025</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1c2430;--mu:#667085;--bd:#e3e6eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1b212a;--tx:#e8ecf2;--mu:#98a2b3;--bd:#2b3340}}
:root[data-theme="dark"]{--bg:#12161c;--card:#1b212a;--tx:#e8ecf2;--mu:#98a2b3;--bd:#2b3340}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:14px;max-width:1100px;margin:auto}
h1{font-size:20px;margin:0 0 2px}.sub{color:var(--mu);margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 10px}
.chip{cursor:pointer;border-radius:16px;padding:4px 12px;border:2px solid;font-weight:600;opacity:.4}.chip.on{opacity:1;color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{border-left:5px solid;padding:8px 10px;background:var(--card);border-radius:8px;border-top:1px solid var(--bd);border-right:1px solid var(--bd);border-bottom:1px solid var(--bd)}
.kpi b{font-size:18px;display:block}.kpi small{color:var(--mu)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:760px){.grid{grid-template-columns:1fr}}
.cv{position:relative;height:280px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:480px}th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:right}th:first-child,td:first-child{text-align:left}th{color:var(--mu);font-weight:600}
h3{margin:0 0 8px;font-size:15px}
</style></head><body>
<h1>FMCG Financial Dashboard</h1>
<div class="sub">HUL · ITC · Nestlé India · Britannia · Dabur — FY2021–FY2025, ₹ crore (standalone)</div>
<div class="card ctl">
<label>Metric <select id="m"></select></label>
<label>Year <select id="y"></select></label>
<label><input type="checkbox" id="ix"> Index (2021 = 100)</label>
<span id="chips" class="ctl"></span>
</div>
<div class="kpis" id="kpis"></div>
<div class="grid">
<div class="card"><h3 id="t1"></h3><div class="cv"><canvas id="c1"></canvas></div></div>
<div class="card"><h3 id="t2"></h3><div class="cv"><canvas id="c2"></canvas></div></div>
</div>
<div class="card"><h3>Ratio scorecard (selected year)</h3><div class="tw"><table id="tb"></table></div></div>
<script>
const Y=[2021,2022,2023,2024,2025];
const C={HUL:'#1f77b4',ITC:'#e69f00',Nestlé:'#d62728',Britannia:'#2ca02c',Dabur:'#9467bd'};
const D={
HUL:{rev:[45996,51193,59144,60469,61469],pat:[7954,8818,9962,10114,10644],ast:[68116,69737,71825,77076,78313],ocf:[8957,8964,9626,14884,11606],npm:[17.29,17.22,16.85,16.73,17.32],roe:[16.77,18.09,19.84,19.84,21.65],cr:[1.20,1.34,1.38,1.64,1.33]},
ITC:{rev:[59746,70251,67293,74238,81640],pat:[15058,18753,20422,35197,20286],ast:[75600,82955,88024,84678,89720],ocf:[14808,17912,16118,16754,17095],npm:[26.78,28.46,32.70,50.89,28.24],roe:[25.95,29.25,30.73,55.87,31.10],cr:[2.67,2.81,2.88,3.01,3.02]},
Nestlé:{rev:[15187,17423,25172,20994,24105],pat:[2118,2391,3933,3315,3545],ast:[8378,9131,10665,12457,13511],ocf:[2236,2737,4175,2935,5048],npm:[13.95,13.72,15.62,15.79,14.70],roe:[108.84,108.52,135.61,88.88,75.21],cr:[1.00,1.13,0.88,0.80,0.96]},
Britannia:{rev:[13371,15618,16186,17296,18446],pat:[1603,2139,2082,2131,2562],ast:[7076,8698,8443,8113,9028],ocf:[1206,2442,2234,2366,2547],npm:[11.99,13.70,12.86,12.32,13.89],roe:[66.73,76.63,62.07,57.48,60.08],cr:[0.93,1.15,1.17,1.03,1.06]},
Dabur:{rev:[8199,8700,9125,9064,9379],pat:[1433,1373,1509,1403,1491],ast:[8688,9476,10664,11125,11924],ocf:[1320,1562,1653,1623,1885],npm:[17.48,15.78,16.54,15.48,15.90],roe:[24.44,22.60,22.86,19.57,19.95],cr:[1.14,0.85,1.19,1.28,1.56]}};
const M={rev:['Revenue / Sales','₹ cr'],pat:['Profit after tax','₹ cr'],ast:['Total assets','₹ cr'],ocf:['Operating cash flow','₹ cr'],npm:['Net profit margin','%'],roe:['Return on equity','%'],cr:['Current ratio','x']};
const on=new Set(Object.keys(C));
const $=id=>document.getElementById(id);
Object.entries(M).forEach(([k,v])=>$('m').add(new Option(v[0],k)));
Y.forEach((y,i)=>$('y').add(new Option(y,i)));$('y').value=4;
const chips=$('chips');
Object.keys(C).forEach(n=>{const b=document.createElement('span');b.className='chip on';b.textContent=n;b.style.cssText='border-color:'+C[n]+';background:'+C[n];
b.onclick=()=>{on.has(n)?on.delete(n):on.add(n);b.classList.toggle('on');b.style.background=on.has(n)?C[n]:'transparent';b.style.color=on.has(n)?'#fff':'inherit';draw()};chips.append(b)});
const f=(v,u)=>u=='%'?v.toFixed(1)+'%':u=='x'?v.toFixed(2)+'x':Math.round(v).toLocaleString('en-IN');
let c1,c2;
function draw(){
const m=$('m').value,yi=+$('y').value,ix=$('ix').checked,u=M[m][1],names=[...on];
const gc=getComputedStyle(document.documentElement).getPropertyValue('--mu')||'#888';
$('kpis').innerHTML=names.map(n=>{const a=D[n][m],g=a[yi]-(yi?a[yi-1]:a[yi]);const ch=yi?(u=='₹ cr'?((a[yi]/a[yi-1]-1)*100).toFixed(1)+'% YoY':(g>=0?'+':'')+g.toFixed(2)+' YoY'):'base year';
return `<div class="kpi" style="border-left-color:${C[n]}"><small>${n}</small><b>${f(a[yi],u)}${u=='₹ cr'?' cr':''}</b><small>${ch}</small></div>`}).join('');
const opt=(t)=>({responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:gc}}},scales:{x:{ticks:{color:gc}},y:{ticks:{color:gc},title:{display:true,text:t,color:gc}}}});
const ds=names.map(n=>{const a=D[n][m];return{label:n,data:ix&&u=='₹ cr'?a.map(v=>v/a[0]*100):a,borderColor:C[n],backgroundColor:C[n],tension:.25}});
$('t1').textContent=M[m][0]+(ix&&u=='₹ cr'?' – trend (2021 = 100)':' – trend');
if(c1)c1.destroy();c1=new Chart($('c1'),{type:'line',data:{labels:Y,datasets:ds},options:opt(ix&&u=='₹ cr'?'Index':u)});
$('t2').textContent=M[m][0]+' – '+Y[yi]+' comparison';
if(c2)c2.destroy();c2=new Chart($('c2'),{type:'bar',data:{labels:names,datasets:[{data:names.map(n=>D[n][m][yi]),backgroundColor:names.map(n=>C[n])}]},options:{...opt(u),plugins:{legend:{display:false}}}});
$('tb').innerHTML='<tr><th>Company</th><th>Net margin</th><th>ROE</th><th>Current ratio</th><th>PAT ₹ cr</th></tr>'+names.map(n=>`<tr><td style="color:${C[n]};font-weight:600">${n}</td><td>${f(D[n].npm[yi],'%')}</td><td>${f(D[n].roe[yi],'%')}</td><td>${f(D[n].cr[yi],'x')}</td><td>${f(D[n].pat[yi],'')}</td></tr>`).join('');
}
['m','y','ix'].forEach(i=>$(i).onchange=draw);draw();
</script></body></html>
